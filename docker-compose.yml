services:
  detector:
    image: ${DETECTOR_IMAGE:-ghcr.io/carminback/gpt56_api_detector:latest}
    container_name: gpt56-api-detector
    restart: unless-stopped
    environment:
      APP_BROWSER_SECRET: ${APP_BROWSER_SECRET:?APP_BROWSER_SECRET is required}
      REPORT_DIR: /data/reports
    ports:
      - "127.0.0.1:${DETECTOR_PORT:-3056}:8000"
    volumes:
      - detector-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  telegram-bot:
    profiles: ["telegram"]
    image: ${DETECTOR_IMAGE:-ghcr.io/carminback/gpt56_api_detector:latest}
    container_name: gpt56-api-detector-telegram
    restart: unless-stopped
    command: ["python", "telegram_bot.py"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      DETECTOR_API_URL: ${DETECTOR_API_URL:-https://check.mewinyou.shop}
      BOT_MAX_CONCURRENT_CHECKS: ${BOT_MAX_CONCURRENT_CHECKS:-2}
      BOT_POLL_INTERVAL_SECONDS: ${BOT_POLL_INTERVAL_SECONDS:-3}
      BOT_JOB_TIMEOUT_SECONDS: ${BOT_JOB_TIMEOUT_SECONDS:-1800}

volumes:
  detector-data:
